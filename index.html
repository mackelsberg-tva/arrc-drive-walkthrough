<title>The New ARRC Drive</title>

<style>
/* Fixed 1920x1080 stage scaled to the window. ARRC palette, matching the essay PDF and the website. */
:root {
  --navy: #15294C; --navy2: #2A4475; --red: #C9342B; --paper: #F5F2E9; --paper2: #EDE9DC;
  --rule: #D4D0C1; --ink: #1B1B18; --ink7: #444441; --ink5: #6B6A63; --letterbox: #0E1B33; --white: #FFFFFF;
  --brown: #AC725E;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  /* Drive window colors */
  --g-frame: #F8FAFD; --g-line: #E3E3E3; --g-soft: #F0F4F9; --g-sel: #C2E7FF; --g-text: #1F1F1F; --g-mute: #5F6368; --g-blue: #0B57D0;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--letterbox); color: var(--ink); font-family: var(--sans); overflow: hidden; }
a { color: inherit; text-decoration: none; }

.stage { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--scale, 1)); transform-origin: center center; background: var(--paper); overflow: hidden; }

/* ---------- slide transitions: the new slide settles in while the old one fades ---------- */
.slide { position: absolute; inset: 0; padding: 0; background: var(--paper); visibility: hidden; opacity: 0; z-index: 0; overflow: hidden; }
.slide.leave { visibility: visible; opacity: 0; z-index: 1; animation: leave .5s ease both; }
.slide.active { visibility: visible; opacity: 1; z-index: 2; animation: enter .75s var(--ease) both; }
.slide.settled, .slide.settled * { animation: none !important; }
.slide.active.soft { animation: none; }
@keyframes enter { from { opacity: 0; transform: scale(1.014); } to { opacity: 1; transform: none; } }
@keyframes leave { from { opacity: 1; } to { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.slide.active .rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--d, 0) * 1ms + 120ms); }

/* ---------- build steps on static slides ---------- */
[data-step] { opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .65s var(--ease); }
[data-step].in { opacity: 1; transform: none; }
[data-step].in.past { opacity: .4; }
.stage.instant *, .stage.instant *::before, .stage.instant *::after { animation: none !important; transition: none !important; }
.slide.snap * { transition: none !important; }

/* shared type */
.corner { position: absolute; top: 76px; right: 128px; height: 50px; width: auto; }
.shead { position: absolute; left: 128px; top: 76px; width: 1300px; }
.kick { font: 700 19px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--red); margin: 0 0 14px; }
h2.t { font: 700 58px/1.06 var(--serif); color: var(--navy); margin: 0; letter-spacing: -.012em; text-wrap: balance; }
.body { position: absolute; left: 128px; right: 128px; top: 250px; }

/* ---------- cover ---------- */
.cover .logo { position: absolute; top: 104px; left: 128px; height: 132px; width: auto; }
.cover .txt { position: absolute; left: 128px; top: 330px; width: 980px; }
.cover h1 { font: 700 132px/.98 var(--serif); color: var(--navy); margin: 0 0 36px; letter-spacing: -.025em; }
.cover .dek { font: italic 400 36px/1.38 var(--serif); color: var(--ink7); margin: 0 0 44px; }
.cover .rule { width: 150px; height: 6px; background: var(--red); }
.cover .when { font: 600 20px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ink5); margin: 32px 0 0; }
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 132px; background: var(--navy); border-top: 8px solid var(--red); display: flex; align-items: center; justify-content: space-between; padding: 0 128px; }
.band span { font: 600 18px var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--rule); }
/* the cover's folder stack */
.stack { position: absolute; left: 1150px; top: 150px; width: 640px; height: 720px; }
.fcard { position: absolute; left: calc(var(--k) * 14px); top: calc(var(--k) * 98px); width: 560px; height: 86px; }
.fcard .tab { position: absolute; left: 0; top: 0; width: 132px; height: 26px; border-radius: 10px 10px 0 0; background: var(--c); }
.fcard .face { position: absolute; left: 0; right: 0; top: 18px; bottom: 0; border-radius: 0 12px 12px 12px; background: var(--c); box-shadow: 0 12px 30px rgba(14,27,51,.18); display: flex; align-items: center; gap: 22px; padding: 0 28px; color: var(--white); }
.fcard .face b { font: 700 22px var(--mono); opacity: .8; }
.fcard .face span { font: 600 25px var(--sans); white-space: nowrap; }
.slide.active .fcard { animation: deal .8s var(--ease) both; animation-delay: calc(var(--k) * 90ms + 250ms); }
@keyframes deal { from { opacity: 0; transform: translate(80px, 22px) rotate(2deg); } to { opacity: 1; transform: none; } }
.fcard.pick .face { outline: 0 solid var(--white); }
.slide.active .fcard.pick { animation: deal .8s var(--ease) both, pick 1s var(--ease) 2.5s both; animation-delay: calc(var(--k) * 90ms + 250ms), 2.4s; }
@keyframes pick { to { transform: translateX(-36px); } }
.ccur { position: absolute; left: 520px; top: 560px; width: 40px; opacity: 0; }
.slide.active .ccur { animation: ccur 1.6s cubic-bezier(.5,0,.2,1) 1.4s both; }
/* the opening sequence: the cover dives into folder 00, a Drive window shows the folder, and opening this presentation leads to slide 2 */
.cover .front { position: absolute; inset: 0; }
.cover .bridge-wrap { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.scene.bridge .gd { left: 242px; top: 110px; width: 1436px; height: 860px; }
@keyframes ccur { 0% { opacity: 0; transform: translate(60px, 120px); } 30% { opacity: 1; } 70% { transform: translate(0, 0); } 78% { transform: scale(.88); } 86%, 100% { opacity: 1; transform: none; } }

/* ---------- section divider ---------- */
.section { background: var(--navy); color: var(--white); }
.section .big { position: absolute; right: 90px; top: 120px; font: 700 640px/1 var(--serif); color: rgba(255,255,255,.055); letter-spacing: -.04em; }
.slide.active.section .big { animation: bigin 1.1s var(--ease) both; }
@keyframes bigin { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
.section .num { position: absolute; left: 128px; top: 320px; font: 700 24px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: #E9A39E; }
.section h2 { position: absolute; left: 128px; top: 366px; margin: 0; font: 700 116px/1.02 var(--serif); letter-spacing: -.02em; max-width: 1300px; }
.section .bar { position: absolute; left: 128px; top: 640px; width: 150px; height: 6px; background: var(--red); transform-origin: left; }
.slide.active.section .bar { animation: grow .8s var(--ease) .35s both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.section p { position: absolute; left: 128px; top: 680px; margin: 0; font: italic 400 38px/1.38 var(--serif); color: var(--rule); max-width: 1180px; }
.section .ko { position: absolute; left: 128px; bottom: 86px; height: 56px; opacity: .85; }

/* ---------- three things ---------- */
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; margin-top: 40px; }
.three > div { background: var(--white); border-radius: 22px; padding: 44px 40px 46px; box-shadow: 0 18px 50px rgba(21,41,76,.09); border-top: 6px solid var(--navy); min-height: 520px; }
.three > div:nth-child(2) { border-top-color: var(--red); }
.three > div:nth-child(3) { border-top-color: var(--brown); }
.three .ill { height: 150px; display: flex; align-items: center; margin-bottom: 26px; }
.three i { display: block; font: normal 700 18px var(--sans); color: var(--red); margin-bottom: 14px; letter-spacing: .14em; text-transform: uppercase; }
.three b { display: block; font: 700 42px/1.12 var(--serif); color: var(--navy); margin-bottom: 18px; text-wrap: balance; }
.three p { margin: 0; font: 400 26px/1.45 var(--serif); color: var(--ink7); }
.three code, .chip-code { font: 500 22px var(--mono); color: var(--navy); background: var(--paper2); padding: 2px 8px; border-radius: 4px; }
.ill .pill { display: inline-flex; align-items: center; gap: 14px; background: var(--g-sel); color: var(--g-text); font: 600 26px var(--sans); padding: 16px 26px; border-radius: 40px; }
.ill .pill svg { width: 34px; height: 34px; }
.ill .fold { display: flex; align-items: center; gap: 18px; font: 600 28px var(--sans); color: var(--g-text); background: var(--g-soft); padding: 18px 24px; border-radius: 14px; }
.ill .fold svg { width: 40px; height: 40px; }
.ill .nm { display: flex; flex-direction: column; gap: 10px; font: 500 22px var(--mono); }
.ill .nm span { padding: 6px 12px; border-radius: 6px; background: var(--paper2); color: var(--navy); }
.ill .nm span.x { background: #F1E4DE; color: #7A4A3A; text-decoration: line-through; text-decoration-thickness: 2px; }

/* ---------- scene: the animated Drive window ---------- */
.scene { position: absolute; inset: 0; }
.scene.fast *, .scene.fast *::before, .scene.fast *::after { transition: none !important; animation: none !important; }
.gd { position: absolute; left: 128px; top: 236px; width: 1236px; height: 770px; background: var(--g-frame); border-radius: 22px; box-shadow: 0 34px 90px rgba(14,27,51,.22), 0 2px 6px rgba(14,27,51,.08); overflow: hidden; display: grid; grid-template-columns: 236px 1fr; grid-template-rows: 74px 1fr; color: var(--g-text); font-family: var(--sans); }
.gd-top { grid-column: 1 / 3; display: flex; align-items: center; gap: 18px; padding: 0 26px; }
.gd-dots { display: flex; gap: 9px; margin-right: 10px; }
.gd-dots i { width: 14px; height: 14px; border-radius: 50%; background: #E1E3E7; }
.gd-brand { display: flex; align-items: center; gap: 12px; font: 500 26px var(--sans); color: #444746; width: 168px; }
.gd-brand svg { width: 34px; height: 34px; }
.gd-search { flex: 1; max-width: 720px; height: 50px; border-radius: 26px; background: #E9EEF6; display: flex; align-items: center; gap: 14px; padding: 0 20px; font: 400 21px var(--sans); color: #444746; }
.gd-search svg { width: 26px; height: 26px; fill: #444746; }
.gd-av { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; background: #D3DCEA; }
.gd-side { padding: 4px 14px 0 14px; }
.gd-new { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 26px 0 18px; border-radius: 18px; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 4px 10px rgba(0,0,0,.06); font: 500 20px var(--sans); margin: 4px 0 18px; }
.gd-new svg { width: 28px; height: 28px; fill: #444746; }
.gd-nav { display: flex; align-items: center; gap: 18px; height: 46px; padding: 0 18px; border-radius: 24px; font: 500 19px var(--sans); color: #1F1F1F; transition: background .3s ease; white-space: nowrap; }
.gd-nav svg { width: 24px; height: 24px; fill: #444746; flex: none; }
.gd-nav.on { background: var(--g-sel); font-weight: 600; }
.gd-nav.sub { padding-left: 50px; }
.gd-main { position: relative; background: var(--white); border-radius: 18px 18px 0 0; margin-right: 16px; overflow: hidden; display: flex; flex-direction: column; }
.gd-crumbs { height: 76px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 28px; white-space: nowrap; overflow: hidden; }
.gd-crumbs .c { font: 400 25px var(--sans); color: #444746; padding: 6px 10px; border-radius: 10px; max-width: 430px; overflow: hidden; text-overflow: ellipsis; }
.gd-crumbs .c.last { color: var(--g-text); font-size: 27px; }
.gd-crumbs .sep { color: #747775; font-size: 28px; }
.gd-crumbs .new { animation: crumb .5s var(--ease) both; }
@keyframes crumb { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
.gd-view { position: relative; flex: 1; }
.gd-pane { position: absolute; inset: 0; padding: 0 22px 0 22px; transition: opacity .38s ease, transform .5s var(--ease); }
.gd-pane.enter { opacity: 0; transform: translateX(42px); }
.gd-pane.leave { opacity: 0; transform: translateX(-42px); }
.gd-pane .it { transition: opacity .45s ease calc(var(--i) * 28ms), transform .55s var(--ease) calc(var(--i) * 28ms), background .3s ease, box-shadow .3s ease; }
.gd-pane.enter .it { opacity: 0; transform: translateY(12px); }
.gd-head { display: grid; grid-template-columns: 1fr 180px 110px; height: 50px; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--g-line); font: 500 18px var(--sans); color: #444746; }
.gd-head .hc { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; margin-left: -8px; border-radius: 8px; justify-self: start; transition: background .25s ease; }
.gd-head .hc.on { color: var(--g-text); font-weight: 600; }
.gd-head .hc i { font-style: normal; color: var(--g-blue); }
.gd-head .hc.hov { background: var(--g-soft); }
.gd-rows { position: relative; }
.gd-row { position: relative; display: grid; grid-template-columns: 1fr 180px 110px; height: 60px; align-items: center; padding: 0 16px; border-bottom: 1px solid #EEF0F2; border-radius: 0; }
.gd-row .nm { display: flex; align-items: center; gap: 18px; min-width: 0; font: 500 21px var(--sans); }
.gd-row .nm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-row svg, .gd-chip svg { flex: none; width: 28px; height: 28px; }
.gd-row .md, .gd-row .sz { font: 400 18px var(--sans); color: #444746; white-space: nowrap; }
.gd-sec { font: 500 19px var(--sans); color: var(--g-text); margin: 6px 4px 14px; transition: opacity .3s ease; }
.gd-sec.gone { opacity: 0; }
.gd-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 10px 12px; margin-bottom: 18px; }
.gd-chip { position: relative; display: flex; align-items: center; gap: 16px; height: 54px; padding: 0 18px; border-radius: 14px; background: var(--g-soft); font: 500 19px var(--sans); min-width: 0; }
.gd-chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gd-title { font: 400 30px var(--sans); margin: 18px 4px 26px; }
.gd-drives { display: flex; gap: 24px; }

.gd-drive b { display: block; padding: 18px 20px; font: 500 22px var(--sans); }
.gd-home { padding-top: 90px; text-align: center; }
.gd-home h3 { font: 400 40px var(--sans); margin: 0 0 30px; color: var(--g-text); }
.gd-home .hs { margin: 0 auto; width: 560px; height: 58px; border-radius: 30px; background: #E9EEF6; display: flex; align-items: center; gap: 16px; padding: 0 24px; color: #444746; font: 400 21px var(--sans); }
.gd-home .hs svg { width: 26px; height: 26px; fill: #444746; }
.gd-home .tips { margin: 54px auto 0; width: 640px; display: grid; gap: 14px; }
.gd-home .tips i { display: block; height: 22px; border-radius: 11px; background: #EEF1F5; }
.gd-home .tips i:nth-child(2) { width: 80%; }
.gd-home .tips i:nth-child(3) { width: 60%; }

/* item states */
.it.sel { background: var(--g-sel) !important; }
.it.hot { background: #FCEBE9 !important; box-shadow: inset 6px 0 0 var(--red); }
.gd-chip.hot { box-shadow: inset 0 0 0 3px var(--red); }
.it.dimmed { opacity: .32; }
.it.drop { background: var(--g-sel) !important; box-shadow: inset 0 0 0 3px var(--g-blue); }
.it.lift { opacity: .35; }
.it.gone { opacity: 0 !important; transform: scale(.94) !important; transition: opacity .3s ease, transform .3s ease !important; }
.gd-row.gone { height: 0; border-bottom-width: 0; overflow: hidden; transition: height .35s var(--ease), opacity .25s ease !important; }
.it .t.flash { animation: flash 1.4s ease both; border-radius: 6px; }
@keyframes flash { 0% { background: #FFE58F; } 100% { background: transparent; } }

/* cursor, ripple, drag ghost, menu, dialog, toast */
.cur { position: absolute; left: -3px; top: -2px; z-index: 60; pointer-events: none; transform: translate(1000px, 800px); }
.cur svg { display: block; width: 36px; height: 46px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.28)); transition: transform .12s ease; transform-origin: 3px 2px; }
.cur.down svg { transform: scale(.86); }
.ripple { position: absolute; z-index: 59; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid rgba(201,52,43,.85); pointer-events: none; animation: ripple .6s ease-out both; }
@keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1); opacity: 0; } }
.ghost { position: absolute; left: 0; top: 0; z-index: 58; display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--white); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.25); font: 500 20px var(--sans); white-space: nowrap; pointer-events: none; }
.ghost svg { width: 26px; height: 26px; }
.ghost em { position: absolute; right: -12px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--g-blue); color: #fff; font: 700 16px/30px var(--sans); text-align: center; font-style: normal; }
.ghost.drop-in { transition: transform .35s ease, opacity .35s ease !important; opacity: 0; }
.menu { position: absolute; z-index: 57; width: 300px; padding: 10px 0; background: var(--white); border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.22); font: 400 20px var(--sans); color: var(--g-text); transform-origin: top left; animation: pop .22s ease both; }
.menu div { display: flex; align-items: center; gap: 18px; height: 48px; padding: 0 22px; }
.menu div svg { width: 22px; height: 22px; fill: #444746; }
.menu div.hov { background: #E8EAED; }
.menu hr { border: 0; border-top: 1px solid var(--g-line); margin: 8px 0; }
@keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.dlg-wrap { position: absolute; inset: 0; z-index: 30; background: rgba(32,33,36,.38); display: grid; place-items: center; animation: fade .25s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dlg { width: 640px; background: var(--white); border-radius: 26px; padding: 34px 34px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: pop .3s var(--ease) both; }
.dlg h4 { margin: 0 0 24px; font: 400 30px var(--sans); }
.dlg .inp { height: 64px; border: 2px solid var(--g-blue); border-radius: 8px; padding: 0 18px; display: flex; align-items: center; font: 400 22px var(--sans); white-space: pre; overflow: hidden; }
.dlg .inp .hl { background: #B3D4FC; }
.caret { display: inline-block; width: 2px; height: 30px; background: #1F1F1F; vertical-align: middle; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dlg .btns { display: flex; justify-content: flex-end; gap: 14px; margin-top: 28px; }
.dlg .btns span { font: 500 20px var(--sans); color: var(--g-blue); padding: 12px 24px; border-radius: 22px; }
.dlg .btns .ok { background: var(--g-blue); color: #fff; }
.toast { position: absolute; z-index: 40; left: 22px; bottom: 22px; display: flex; align-items: center; gap: 30px; background: #1F1F1F; color: #F2F2F2; font: 400 20px var(--sans); padding: 18px 26px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(20px); transition: opacity .3s ease, transform .4s var(--ease); pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
.toast u { text-decoration: none; color: #A8C7FA; font-weight: 600; }

/* caption column */
.caps { position: absolute; left: 1424px; top: 236px; width: 368px; height: 770px; }
.dots { display: flex; gap: 10px; height: 14px; margin-top: 6px; }
.dots i { width: 34px; height: 6px; border-radius: 3px; background: var(--rule); transition: background .4s ease; }
.dots i.on { background: var(--red); }
.capstack { position: relative; margin-top: 30px; }
.cap { position: absolute; left: 0; right: 0; top: 0; opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .6s var(--ease); }
.cap.on { opacity: 1; transform: none; transition-delay: .12s; }
.cap b { display: block; font: 700 40px/1.12 var(--serif); color: var(--navy); margin-bottom: 18px; text-wrap: balance; }
.cap p { margin: 0; font: 400 26px/1.45 var(--serif); color: var(--ink7); }
.foot { position: absolute; left: 0; right: 0; bottom: 0; padding-top: 18px; border-top: 2px solid var(--rule); font: 400 21px/1.45 var(--serif); color: var(--ink5); }
.foot b { font-family: var(--sans); font-weight: 600; color: var(--navy); }
/* click-path tracker */
.trail { position: absolute; left: 0; right: 0; bottom: 0; }
.trail .count { font: 700 21px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 18px; }
.trail ol { list-style: none; margin: 0; padding: 0; position: relative; }
.trail li { position: relative; padding: 0 0 18px 42px; font: 500 20px/1.3 var(--sans); color: #A9A69B; transition: color .4s ease; }
.trail li::before { content: ""; position: absolute; left: 7px; top: 5px; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #C9C5B7; background: var(--paper); transition: border-color .4s ease, background .4s ease; }
.trail li::after { content: ""; position: absolute; left: 15px; top: 26px; bottom: 0; width: 3px; background: #DCD8CB; }
.trail li:last-child::after { display: none; }
.trail li.on { color: var(--navy); }
.trail li.on::before { border-color: var(--navy); background: var(--navy); }
.trail li.now::before { border-color: var(--red); background: var(--red); box-shadow: 0 0 0 6px rgba(201,52,43,.15); }

/* ---------- shelf ---------- */
.shelf { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 360px; gap: 34px 40px; }
.shelf > div { background: var(--white); border-radius: 20px; padding: 40px 44px; box-shadow: 0 14px 40px rgba(21,41,76,.08); }
.shelf h3 { display: flex; align-items: center; gap: 18px; margin: 0 0 26px; font: 600 36px var(--sans); color: var(--navy); }
.shelf h3 svg { width: 44px; height: 44px; }
.shelf ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.shelf li { display: grid; grid-template-columns: 32px 1fr; gap: 16px; align-items: start; font: 400 25px/1.4 var(--serif); color: var(--ink7); }
.shelf li svg { width: 26px; height: 26px; margin-top: 3px; }
.shelf li b { display: block; font: 600 24px var(--sans); color: var(--g-text); margin-bottom: 2px; }

/* ---------- what moved ---------- */
.moved { display: grid; border-top: 3px solid var(--ink); margin-top: 6px; }
.mv { display: grid; grid-template-columns: 430px 1fr 70px 1fr; gap: 24px; align-items: center; padding: 24px 0; border-bottom: 1px solid var(--rule); }
.mv > b { font: 700 30px/1.2 var(--serif); color: var(--navy); }
.mv .old { font: 500 21px/1.4 var(--mono); color: #8B887E; text-decoration: line-through; text-decoration-color: rgba(201,52,43,.6); text-decoration-thickness: 2px; }
.mv .new { font: 500 21px/1.4 var(--mono); color: var(--navy); background: var(--white); border-left: 5px solid var(--navy); padding: 10px 14px; border-radius: 4px; box-shadow: 0 4px 14px rgba(21,41,76,.06); }
.mv .new.txt { font: 400 23px/1.4 var(--serif); }
.mv svg { width: 54px; height: 24px; }
.mv svg path { stroke-dasharray: 70; stroke-dashoffset: 70; transition: stroke-dashoffset .7s var(--ease) .25s; }
.mv.in svg path { stroke-dashoffset: 0; }
.mv .new { opacity: 0; transform: translateX(-12px); transition: opacity .5s ease .45s, transform .6s var(--ease) .45s; }
.mv.in .new { opacity: 1; transform: none; }
.note { margin-top: 30px; font: italic 400 26px/1.4 var(--serif); color: var(--ink5); }

/* ---------- naming rule ---------- */
.rulez { display: grid; gap: 22px; margin-top: 4px; }
.rz { display: grid; grid-template-columns: 330px 1fr; gap: 4px 40px; align-items: center; background: var(--white); border-radius: 18px; padding: 26px 36px; box-shadow: 0 12px 34px rgba(21,41,76,.07); }
.rz > b { font: 700 32px/1.15 var(--serif); color: var(--navy); }
.rz .segs { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.seg { display: flex; flex-direction: column; gap: 6px; opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .55s var(--ease); transition-delay: calc(var(--j) * 160ms + 150ms); }
.rz.in .seg { opacity: 1; transform: none; }
.seg span { font: 500 27px var(--mono); padding: 8px 14px; border-radius: 6px; background: var(--paper2); color: var(--ink); white-space: nowrap; }
.seg small { font: 600 14px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink5); padding-left: 4px; }
.seg.d span { background: #DCE4F1; color: var(--navy); }
.seg.s span { background: #FBE7C6; color: #7A4E00; }
.seg.a span { background: #F1E1DA; color: #7A4A3A; }
.rz p { grid-column: 2; margin: 4px 0 0; font: 400 22px/1.4 var(--serif); color: var(--ink5); }

/* ---------- close ---------- */
.close { display: grid; grid-template-columns: 1.15fr 1fr; gap: 80px; }
.links a { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 34px 0; border-bottom: 1px solid var(--rule); font: 600 34px var(--sans); color: var(--navy); }
.links a:first-child { border-top: 3px solid var(--ink); }
.links a span { font: 500 20px var(--mono); color: var(--ink5); text-align: right; }
.links a:hover span { color: var(--red); }
.qs { background: var(--navy); color: var(--white); padding: 52px 56px; border-top: 8px solid var(--red); border-radius: 0 0 18px 18px; align-self: start; }
.qs b { display: block; font: 700 62px/1.05 var(--serif); margin-bottom: 26px; }
.qs p { margin: 0 0 16px; font: italic 400 30px/1.45 var(--serif); color: var(--rule); }
.qs .go { display: inline-flex; align-items: center; gap: 14px; margin-top: 30px; background: var(--white); color: var(--navy); font: 700 24px var(--sans); padding: 18px 28px; border-radius: 40px; }
.qs .go svg { width: 26px; height: 26px; fill: var(--navy); }
.qs .go:hover { background: var(--paper); }

/* ---------- chrome: progress bar, counter, notes ---------- */
.chrome { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 16px; opacity: .28; transition: opacity .2s; z-index: 5; }
.chrome:hover, .chrome:focus-within { opacity: 1; }
.scrub { flex: 1; display: flex; gap: 4px; height: 20px; min-width: 0; }
.sg { position: relative; display: flex; gap: 1px; border-radius: 4px; overflow: hidden; min-width: 0; }
.tick { flex: 1; background: #34476B; border: 0; padding: 0; cursor: pointer; }
.tick:hover { background: #5C7099; }
.sg.on .tick { background: #4A5E86; }
.tick.on { background: var(--red) !important; }
.sg-l { position: absolute; left: 8px; right: 6px; top: 0; font: 500 11px/20px var(--sans); color: #E6E8EE; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.count { font: 500 13px var(--mono); color: #C4CCDA; font-variant-numeric: tabular-nums; white-space: nowrap; }
.navb { background: none; border: 1px solid #4A5E86; color: #E6E8EE; font: 600 13px var(--sans); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
.navb:focus-visible, .tick:focus-visible { outline: 2px solid var(--white); outline-offset: 1px; }
.notes { position: absolute; left: 128px; right: 128px; bottom: 96px; z-index: 70; background: rgba(21,41,76,.96); color: var(--white); padding: 26px 32px; border-left: 8px solid var(--red); font: 400 26px/1.45 var(--sans); }
.notes b { display: block; font: 700 15px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #E9A39E; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="chrome" id="chrome">
  <button class="navb" id="prev" aria-label="Back">&larr;</button>
  <div class="scrub" id="scrub"></div>
  <button class="navb" id="next" aria-label="Forward">&rarr;</button>
  <button class="navb" id="ntog" aria-label="Toggle speaker notes">Notes</button>
  <button class="navb" id="fs" aria-label="Full screen" title="Full screen (F)">Full screen</button>
  <span class="count" id="count"></span>
</div>

// ---------- one animated Drive window ----------
class Scene {
  constructor(slide, def) {
    this.def = def; this.slide = slide;
    this.root = slide.querySelector(".scene");
    this.gd = this.root.querySelector(".gd");
    this.view = this.gd.querySelector(".gd-view");
    this.crumbsEl = this.gd.querySelector(".gd-crumbs");
    this.toastEl = this.gd.querySelector(".toast");
    this.cur = this.root.querySelector(".cur");
    this.capEls = [...this.root.querySelectorAll(".cap")];
    this.dotEls = [...this.root.querySelectorAll(".dots i")];
    this.trailEls = [...this.root.querySelectorAll(".trail li")];
    this.countEl = this.root.querySelector(".trail .count");
    this.total = def.steps.length; this.step = 0;
    this.fast = false; this.wakers = new Set(); this.running = null;
    this.reset();
  }
  // timing: every wait resolves at once in fast mode, and hurry() releases waits already running
  wait(ms) {
    if (this.fast || ms <= 0) return Promise.resolve();
    return new Promise(res => { let t; const done = () => { clearTimeout(t); this.wakers.delete(done); res(); }; t = setTimeout(done, ms); this.wakers.add(done); });
  }
  hurry() { if (!this.running) return; this.fast = true; this.root.classList.add("fast"); [...this.wakers].forEach(f => f()); }
  get key() { return this.path[this.path.length - 1]; }

  reset() {
    this.T = JSON.parse(JSON.stringify(TREE));
    this.path = [...this.def.start]; this.sort = "name"; this.side = this.def.side || "shared";
    this.root.querySelectorAll(".ghost, .menu, .ripple").forEach(n => n.remove());
    this.gd.querySelectorAll(".dlg-wrap").forEach(n => n.remove());
    this.ghost = null; this.toastEl.classList.remove("on");
    this.view.innerHTML = ""; this.pane = this.renderPane(this.key); this.view.appendChild(this.pane);
    this.renderCrumbs(false); this.renderSide();
    const [x, y] = this.def.cursor || [1060, 860];
    this.cx = x; this.cy = y; this.cur.style.transition = "none"; this.cur.style.transform = `translate(${x}px,${y}px)`;
    this.setCap(0);
  }
  async jumpTo(n) {
    if (this.running) { this.hurry(); try { await this.running; } catch (e) {} }
    this.fast = true; this.root.classList.add("fast");
    this.reset();
    for (let i = 1; i <= n; i++) { this.setCap(i); await this.def.steps[i - 1](this); }
    this.step = n; this.setCap(n);
    void this.root.offsetWidth; this.root.classList.remove("fast"); this.fast = false;
  }
  async play(n) {
    this.step = n; this.setCap(n); this.toastEl.classList.remove("on");
    this.fast = false; this.root.classList.remove("fast");
    const p = this.def.steps[n - 1](this);
    this.running = p;
    try { await p; } finally { if (this.running === p) this.running = null; this.fast = false; this.root.classList.remove("fast"); }
  }
  setCap(n) {
    this.capEls.forEach((c, i) => c.classList.toggle("on", i === n));
    this.dotEls.forEach((d, i) => d.classList.toggle("on", i < n));
    if (this.trailEls.length) {
      this.trailEls.forEach((li, i) => { li.classList.toggle("on", i <= n); li.classList.toggle("now", i === n); });
      this.countEl.textContent = n === 0 ? "Start here" : n === 1 ? "1 click" : `${n} clicks`;
    }
  }

  // ---- rendering ----
  sorted(f) {
    const az = (a, b) => (a.sk || a.n).localeCompare(b.sk || b.n, "en", { sensitivity: "base" });
    const by = this.sort === "mod" ? (a, b) => b.ts.localeCompare(a.ts) : this.sort === "za" ? (a, b) => az(b, a) : az;
    const fol = f.items.filter(i => FOLDERISH.has(i.t)).sort(by), fil = f.items.filter(i => !FOLDERISH.has(i.t)).sort(by);
    return [...fol, ...fil];
  }
  headHTML() {
    const n = this.sort === "name" || this.sort === "za", m = this.sort === "mod";
    return `<span class="hc${n ? " on" : ""}" data-col="name">Name${n ? ` <i>${this.sort === "za" ? "&darr;" : "&uarr;"}</i>` : ""}</span><span class="hc${m ? " on" : ""}" data-col="mod">Last modified${m ? " <i>&darr;</i>" : ""}</span><span class="hc">File size</span>`;
  }
  rowHTML(it, i) {
    return `<div class="gd-row it" style="--i:${i}" data-uid="${it.uid}" data-name="${esc(it.n)}"><span class="nm">${ICO[it.t]}<span class="t">${esc(it.n)}</span></span><span class="md">${fmt(it.ts)}</span><span class="sz">${it.sz}</span></div>`;
  }
  chipHTML(it, i) { return `<div class="gd-chip it" style="--i:${i}" data-uid="${it.uid}" data-name="${esc(it.n)}">${ICO[it.t]}<span class="t">${esc(it.n)}</span></div>`; }
  renderPane(key) {
    const f = this.T[key], p = document.createElement("div");
    p.className = "gd-pane";
    if (f.kind === "home") {
      p.innerHTML = `<div class="gd-home"><h3>Welcome to Drive</h3><div class="hs">${NAV.search}<span>Search in Drive</span></div><div class="tips"><i></i><i></i><i></i></div></div>`;
    } else if (f.kind === "drives") {
      p.innerHTML = `<div class="gd-drives"><div class="gd-drive it" style="--i:0" data-name="ARRC"><div class="img"></div><b>ARRC</b></div></div>`;
    } else if (f.grid) {
      const items = this.sorted(f), fol = items.filter(i => FOLDERISH.has(i.t)), fil = items.filter(i => !FOLDERISH.has(i.t));
      const cols = f.cols || 3;
      p.innerHTML = `<div class="gd-sec">Folders</div><div class="gd-grid" style="--cols:${cols}">${fol.map((it, i) => this.chipHTML(it, i)).join("")}</div>` +
        (fil.length ? `<div class="gd-sec files">Files</div><div class="gd-grid files" style="--cols:${cols}">${fil.map((it, i) => this.chipHTML(it, i + fol.length)).join("")}</div>` : "");
    } else {
      p.innerHTML = `<div class="gd-head">${this.headHTML()}</div><div class="gd-rows">${this.sorted(f).map((it, i) => this.rowHTML(it, i)).join("")}</div>`;
    }
    return p;
  }
  renderCrumbs(animate) {
    // Inside the drive, show ARRC first and fold the middle of deep paths into "…", as Drive does.
    let names = this.path.map(k => this.T[k].name);
    if (names[0] === "Shared drives" && names.length > 2) names = names.slice(1);
    if (names.length > 3) names = [names[0], "…", ...names.slice(-2)];
    this.crumbsEl.innerHTML = names.map((n, i) => (i ? '<span class="sep">&rsaquo;</span>' : "") + `<span class="c${i === names.length - 1 ? " last" : ""}${animate && i === names.length - 1 ? " new" : ""}">${esc(n)}</span>`).join("");
  }
  renderSide() {
    // like Drive's folder tree: once you're in Shared drives, ARRC shows underneath it
    const items = [["home", "Home"], ["mydrive", "My Drive"], ["shared", "Shared drives"], ["arrc", "ARRC", "sub"], ["swm", "Shared with me"], ["recent", "Recent"], ["starred", "Starred"], ["trash", "Trash"]]
      .filter(([k]) => k !== "arrc" || this.side === "shared" || this.side === "arrc");
    this.gd.querySelector(".gd-navs").innerHTML = items.map(([k, l, c]) => `<div class="gd-nav${c ? " " + c : ""}${k === this.side ? " on" : ""}" data-k="${k}">${NAV[k === "arrc" ? "shared" : k]}<span>${l}</span></div>`).join("");
  }
  setSide(k) { this.side = k; this.renderSide(); }

  // ---- lookups and geometry ----
  el(name) { return [...this.pane.querySelectorAll(".it")].find(n => n.dataset.name === name); }
  nav(k) { return this.gd.querySelector(`.gd-nav[data-k="${k}"]`); }
  col(c) { return this.pane.querySelector(`.hc[data-col="${c}"]`); }
  box(el) {
    const s = this.root.getBoundingClientRect(), r = el.getBoundingClientRect(), k = s.width / 1920;
    return { x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k };
  }
  point(el, o = {}) {
    const b = this.box(el);
    const dx = o.dx === "c" ? b.w / 2 : (o.dx != null ? o.dx : Math.min(34, b.w / 2));
    return { x: b.x + dx, y: b.y + (o.dy != null ? o.dy : b.h / 2) };
  }

  // ---- cursor ----
  async cursorTo(t, o = {}) {
    const p = t && t.nodeType ? this.point(t, o) : t;
    const dist = Math.hypot(p.x - this.cx, p.y - this.cy);
    const dur = o.dur || Math.max(650, Math.min(1450, 420 + dist * 0.8));
    this.cx = p.x; this.cy = p.y;
    const tr = this.fast ? "none" : `transform ${dur}ms cubic-bezier(.45,.05,.2,1)`;
    this.cur.style.transition = tr; this.cur.style.transform = `translate(${p.x}px,${p.y}px)`;
    if (this.ghost) { this.ghost.style.transition = tr; this.ghost.style.transform = `translate(${p.x + 26}px,${p.y + 22}px) rotate(-2deg)`; }
    await this.wait(dur + 40);
  }
  ripple() {
    if (this.fast) return;
    const r = document.createElement("div"); r.className = "ripple";
    r.style.left = this.cx + "px"; r.style.top = this.cy + "px";
    this.root.appendChild(r); setTimeout(() => r.remove(), 700);
  }
  async click(dbl = false) {
    for (let i = 0; i < (dbl ? 2 : 1); i++) {
      this.ripple(); this.cur.classList.add("down"); await this.wait(110); this.cur.classList.remove("down"); await this.wait(dbl && !i ? 70 : 160);
    }
  }
  select(el) { this.pane.querySelectorAll(".it.sel").forEach(n => n.classList.remove("sel")); if (el) el.classList.add("sel"); }
  emph(names, dim = true) {
    this.pane.querySelectorAll(".it").forEach(n => {
      const on = names.includes(n.dataset.name);
      n.classList.remove("sel"); n.classList.toggle("hot", on); n.classList.toggle("dimmed", dim && !on);
    });
  }

  // ---- actions ----
  async open(key, reset = false) {
    if (reset) this.path = [key]; else this.path.push(key);
    const old = this.pane, nu = this.renderPane(key);
    this.pane = nu; this.renderCrumbs(!this.fast);
    if (this.fast) { old.remove(); this.view.appendChild(nu); return; }
    nu.classList.add("enter"); this.view.appendChild(nu); old.classList.add("leave");
    void nu.offsetWidth; nu.classList.remove("enter");
    await this.wait(560); old.remove();
  }
  async into(name, key) { const e = this.el(name); await this.cursorTo(e); this.select(e); await this.click(true); await this.open(key); }
  async resort() {
    const box = this.pane.querySelector(".gd-rows"); if (!box) return;
    const rows = [...box.children], first = new Map(rows.map(r => [r, r.offsetTop]));
    this.sorted(this.T[this.key]).forEach(it => { const r = box.querySelector(`[data-uid="${it.uid}"]`); if (r) box.appendChild(r); });
    if (this.fast) return;
    rows.forEach(r => { const dy = first.get(r) - r.offsetTop; if (dy) { r.style.transition = "none"; r.style.transform = `translateY(${dy}px)`; } });
    void box.offsetWidth;
    rows.forEach(r => { if (r.style.transform) { r.style.transition = "transform .75s cubic-bezier(.2,.8,.2,1)"; r.style.transform = ""; } });
    await this.wait(800);
    rows.forEach(r => { r.style.transition = ""; });
  }
  async sortBy(c) {
    const h = this.col(c === "za" ? "name" : c); await this.cursorTo(h, { dx: 50 }); h.classList.add("hov"); await this.click();
    this.sort = c; this.pane.querySelector(".gd-head").innerHTML = this.headHTML();
    await this.resort();
  }
  item(el) { const f = this.T[this.key]; return f.items.find(i => i.uid === +el.dataset.uid); }
  setName(el, n) {
    this.item(el).n = n; el.dataset.name = n;
    const t = el.querySelector(".t"); t.textContent = n;
    if (!this.fast) { t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); }
  }
  showToast(text) { this.toastEl.innerHTML = `<span>${esc(text)}</span><u>Undo</u>`; this.toastEl.classList.add("on"); }

  async drag(name, dst) {
    const src = this.el(name), to = this.el(dst);
    await this.cursorTo(src); this.select(src);
    this.cur.classList.add("down"); await this.wait(200);
    src.classList.add("lift");
    if (!this.fast) {
      const it = this.item(src), g = document.createElement("div");
      g.className = "ghost"; g.innerHTML = `${ICO[it.t]}<span>${esc(it.n)}</span><em>1</em>`;
      g.style.transform = `translate(${this.cx + 26}px,${this.cy + 22}px) rotate(-2deg)`;
      this.root.appendChild(g); this.ghost = g; await this.wait(180);
    }
    await this.cursorTo(to, { dur: 1500 });
    to.classList.add("drop"); await this.wait(450);
    this.cur.classList.remove("down");
    if (this.ghost) { const g = this.ghost; this.ghost = null; g.classList.add("drop-in"); g.style.transform += " scale(.3)"; setTimeout(() => g.remove(), 400); }
    await this.wait(120); to.classList.remove("drop");
    const f = this.T[this.key]; f.items = f.items.filter(i => i.uid !== +src.dataset.uid);
    src.classList.add("gone"); await this.wait(380); src.remove();
    const files = this.pane.querySelector(".gd-grid.files");
    if (files && !files.children.length) this.pane.querySelector(".gd-sec.files").classList.add("gone");
    this.showToast(`1 item moved to “${dst}”`);
  }

  async rename(name, newName, prefix = false) {
    const row = this.el(name);
    await this.cursorTo(row, { dx: 260 }); this.select(row);
    this.ripple(); await this.wait(180);
    let m = null;
    if (!this.fast) {
      m = document.createElement("div"); m.className = "menu";
      m.innerHTML = `<div>${NAV.open}Open with</div><div>${NAV.dl}Download</div><div data-k="rename">${NAV.edit}Rename</div><div>${NAV.copy}Make a copy</div><hr><div>${NAV.share}Share</div><div>${NAV.trash}Move to trash</div>`;
      m.style.left = (this.cx + 8) + "px"; m.style.top = Math.min(this.cy + 8, 1060 - 380) + "px";
      this.root.appendChild(m); await this.wait(320);
      const ri = m.querySelector('[data-k="rename"]');
      await this.cursorTo(ri, { dx: 90, dur: 600 }); ri.classList.add("hov"); await this.click(); m.remove();
    }
    const wrap = document.createElement("div"); wrap.className = "dlg-wrap";
    wrap.innerHTML = `<div class="dlg"><h4>Rename</h4><div class="inp"></div><div class="btns"><span>Cancel</span><span class="ok">OK</span></div></div>`;
    this.gd.appendChild(wrap);
    const inp = wrap.querySelector(".inp"), caret = '<i class="caret"></i>';
    if (this.fast) { inp.innerHTML = esc(newName) + caret; }
    else if (prefix) {
      inp.innerHTML = caret + esc(name); await this.wait(650);
      const add = newName.slice(0, newName.length - name.length);
      for (let j = 1; j <= add.length; j++) { inp.innerHTML = esc(add.slice(0, j)) + caret + esc(name); await this.wait(70); }
    } else {
      inp.innerHTML = `<span class="hl">${esc(name)}</span>`; await this.wait(750);
      for (let j = 1; j <= newName.length; j++) { inp.innerHTML = esc(newName.slice(0, j)) + caret; await this.wait(j < 11 ? 75 : 38); }
    }
    await this.wait(250);
    if (!this.fast) { const ok = wrap.querySelector(".ok"); await this.cursorTo(ok, { dx: "c" }); await this.click(); }
    wrap.remove(); this.select(null);
    this.setName(row, newName);
    await this.wait(500);
  }
  async quickRename(pairs) {
    for (const [a, b] of pairs) { const e = this.el(a); this.setName(e, b); await this.wait(420); }
  }
}

// ---------- slide builders ----------
function gdHTML() {
  return `<div class="gd">
    <div class="gd-top"><div class="gd-dots"><i></i><i></i><i></i></div><div class="gd-brand">${FOLD("#5F6368")}<span>Drive</span></div><div class="gd-search">${NAV.search}<span>Search in Drive</span></div><div class="gd-av"></div></div>
    <div class="gd-side"><div class="gd-new">${NAV.plus}New</div><div class="gd-navs"></div></div>
    <div class="gd-main"><div class="gd-crumbs"></div><div class="gd-view"></div><div class="toast"></div></div>
  </div>`;
}
function sceneHTML(s) {
  const dots = s.steps.length > 1 ? `<div class="dots">${s.steps.map(() => "<i></i>").join("")}</div>` : `<div class="dots"></div>`;
  const caps = s.caps.map(([b, p]) => `<div class="cap"><b>${b}</b><p>${p}</p></div>`).join("");

const ticks = [];
let seg = null, last = null;
SLIDES.forEach((s, i) => {
  if (s.sec !== last) { seg = document.createElement("div"); seg.className = "sg"; seg.dataset.sec = s.sec; seg.innerHTML = `<span class="sg-l">${s.sec}</span>`; scrub.appendChild(seg); last = s.sec; }

  t.addEventListener("click", () => show(i, { step: 0, instant: true })); seg.insertBefore(t, seg.querySelector(".sg-l")); ticks.push(t);

let cur = 0, notesOn = false, leaveTimer = null;

// Static builds: reveal data-step <= n; earlier "focus" items fade back so one thing is in focus.
function applyStep(slide, n) {
  slide._step = n;
  if (slide._scene) { slide._scene.jumpTo(n); return; }
  slide.querySelectorAll("[data-step]").forEach(el => {
    const k = +el.dataset.step;
    el.classList.toggle("in", k <= n);
    el.classList.toggle("past", el.hasAttribute("data-focus") && k < n);
  });
}

function show(i, { step = 0, instant = false, keep = null } = {}) {
  const next = Math.max(0, Math.min(slides.length - 1, i));
  const prev = slides[cur], same = next === cur;
  if (prev && prev._scene) prev._scene.hurry();
  cur = next;
  const slide = slides[cur];
  if (instant) stage.classList.add("instant");
  clearTimeout(leaveTimer);
  slides.forEach(s => s.classList.remove("leave"));
  if (!same && prev && prev !== keep) { prev.classList.remove("active", "settled", "soft"); if (!instant) { prev.classList.add("leave"); leaveTimer = setTimeout(() => prev.classList.remove("leave"), 550); } }
  if (slide.classList.contains("cover") && typeof bridgeScene !== "undefined") coverReset(slide);
  slide.classList.add("active");
  if (instant) slide.classList.add("settled");
  slide.classList.add("snap"); applyStep(slide, step === "last" ? slide._total : Math.min(step, slide._total)); void slide.offsetWidth; slide.classList.remove("snap");
  if (instant) { void stage.offsetWidth; requestAnimationFrame(() => stage.classList.remove("instant")); }
  ticks.forEach((t, k) => t.classList.toggle("on", k === cur));
  [...scrub.children].forEach(sg => sg.classList.toggle("on", sg.dataset.sec === SLIDES[cur].sec));
  document.getElementById("count").textContent = `${cur + 1} / ${slides.length}`;
  const h = "#s" + (cur + 1);
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) {} }
}
// Forward: finish a running animation, else play the next build step, else go to the next slide.
function advance() {
  if (zooming) return;
  const slide = slides[cur], sc = slide._scene;
  if (sc && sc.running) { sc.hurry(); return; }
  if (slide._step < slide._total) {
    slide._step++;
    if (sc) sc.play(slide._step); else applyStep(slide, slide._step);
    return;
  }
  // The cover takes two presses: one opens folder 00, the next opens this presentation.
  if (cur === 0 && slide.classList.contains("cover") && !instantMotion()) {
    if (coverStage === 0) { coverOpen(slide); return; }
    if (coverStage === 1) { coverFinish(); return; }
    if (coverStage === 2) { coverStage = 3; coverBusy = true; bridgeScene.play(1); return; }
    coverStop(); show(1); return;
  }
  if (cur < slides.length - 1) {
    const nx = slides[cur + 1];
    if (!instantMotion() && SLIDES[cur + 1].cont) return softTo(cur + 1, 650);
    if (!instantMotion() && (slide.classList.contains("section") || nx.classList.contains("section"))) return softTo(cur + 1, 1100);
    show(cur + 1);
  }
}
// A gentle cross-fade: the old slide stays put while the new one fades in on top of it.
// Used around the blue section slides, and where one Drive scene picks up where the last one ended.
function softTo(i, dur) {
  const prev = slides[cur], nx = slides[i];
  nx.classList.add("soft");

  prev.style.zIndex = 1;
  // when the Drive window carries over, clear the old title and caption first so the two never overlap
  const out = SLIDES[i].cont ? [...prev.querySelectorAll(".shead, .caps")].map(e => e.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: "ease-out", fill: "forwards" })) : [];
  const an = nx.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, delay: out.length ? 180 : 0, easing: "ease-in-out", fill: "backwards" });
